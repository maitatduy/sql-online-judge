name: sqljudge-dev

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 768m
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_AUTH_PASSWORD: ${MYSQL_AUTH_PASSWORD}
      MYSQL_PROBLEM_PASSWORD: ${MYSQL_PROBLEM_PASSWORD}
      MYSQL_SUBMISSION_PASSWORD: ${MYSQL_SUBMISSION_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 128m
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    mem_limit: 64m
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      TZ: UTC
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    mem_limit: 512m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      TZ: UTC
    ports:
      - "127.0.0.1:${KAFKA_PORT}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  sandbox-postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_DB: sandbox
      POSTGRES_PASSWORD: ${SANDBOX_PG_SUPERUSER_PASSWORD}
      SANDBOX_PG_ADMIN_USER: ${SANDBOX_PG_ADMIN_USER}
      SANDBOX_PG_ADMIN_PASSWORD: ${SANDBOX_PG_ADMIN_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:${SANDBOX_PG_PORT}:5432"
    volumes:
      - ./sandbox/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - sandbox
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sandbox"]
      interval: 10s
      timeout: 3s
      retries: 5

  sandbox-mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    command:
      - --local-infile=0
      - --secure-file-priv=NULL
      - --skip-log-bin
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
    environment:
      MYSQL_ROOT_PASSWORD: ${SANDBOX_MYSQL_ROOT_PASSWORD}
      SANDBOX_MYSQL_ADMIN_USER: ${SANDBOX_MYSQL_ADMIN_USER}
      SANDBOX_MYSQL_ADMIN_PASSWORD: ${SANDBOX_MYSQL_ADMIN_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:${SANDBOX_MYSQL_PORT}:3306"
    volumes:
      - ./sandbox/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - sandbox
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  sandbox:

volumes:
  mysql-data:
  redis-data:
  kafka-data:
