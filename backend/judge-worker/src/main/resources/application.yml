server:
  port: 9089
  shutdown: graceful

spring:
  application:
    name: judge-worker
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          problem-service:
            connect-timeout: 1000
            read-timeout: 10000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: judge-worker
      auto-offset-reset: earliest
    producer:
      acks: all
      compression-type: zstd
      properties:
        max.request.size: 16777216
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        timeout-duration: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

sqljudge:
  judge:
    consumer-concurrency: 2
    publish-timeout: 10s
  problem-service-url: ${PROBLEM_SERVICE_URL}
  internal:
    api-token: ${INTERNAL_API_TOKEN}
  sandbox:
    postgres:
      jdbc-url: jdbc:postgresql://${SANDBOX_PG_HOST}:${SANDBOX_PG_PORT}/sandbox
      admin-user: ${SANDBOX_PG_ADMIN_USER}
      admin-password: ${SANDBOX_PG_ADMIN_PASSWORD}
    mysql:
      server-url: jdbc:mysql://${SANDBOX_MYSQL_HOST}:${SANDBOX_MYSQL_PORT}/
      admin-user: ${SANDBOX_MYSQL_ADMIN_USER}
      admin-password: ${SANDBOX_MYSQL_ADMIN_PASSWORD}
    sqlite:
      work-directory: ${SANDBOX_SQLITE_DIR}
