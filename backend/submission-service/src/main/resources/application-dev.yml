spring:
  config:
    import: optional:file:../../infra/.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT}/sqljudge_submission
    username: sqljudge_submission
    password: ${MYSQL_SUBMISSION_PASSWORD}

management:
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
