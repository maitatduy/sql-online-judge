server:
  port: 8088
  shutdown: graceful

spring:
  application:
    name: notification-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          auth-service:
            connect-timeout: 1000
            read-timeout: 3000
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
    producer:
      acks: all
      compression-type: zstd
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL}/internal/jwks

management:
  health:
    mail:
      enabled: false
  server:
    port: 9088
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

sqljudge:
  auth-service-url: ${AUTH_SERVICE_URL}
  internal:
    api-token: ${INTERNAL_API_TOKEN}
  email:
    from: ${MAIL_FROM}
    frontend-url: ${FRONTEND_URL}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - feign.FeignException$NotFound
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
