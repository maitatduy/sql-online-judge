spring:
  data:
    redis:
      host: localhost
      port: 1
      password: ""
  kafka:
    bootstrap-servers: localhost:1
    listener:
      auto-startup: false
    admin:
      auto-create: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:1/internal/jwks

sqljudge:
  outbox:
    relay-enabled: false
  contest:
    lifecycle-enabled: false
    standings-listener-enabled: false
  problem-service-url: http://localhost:1
  auth-service-url: http://localhost:1
  internal:
    api-token: test-internal-token

management:
  health:
    redis:
      enabled: false
