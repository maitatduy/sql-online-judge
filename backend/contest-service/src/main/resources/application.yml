server:
  port: 8085
  shutdown: graceful

spring:
  application:
    name: contest-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          problem-service:
            connect-timeout: 1000
            read-timeout: 3000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL}/internal/jwks

management:
  server:
    port: 9085
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

sqljudge:
  problem-service-url: ${PROBLEM_SERVICE_URL}
  internal:
    api-token: ${INTERNAL_API_TOKEN}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
