spring:
  config:
    import: optional:file:../../infra/.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT}/sqljudge_auth
    username: sqljudge_auth
    password: ${MYSQL_AUTH_PASSWORD}

management:
  endpoint:
    health:
      show-details: always

sqljudge:
  jwt:
    generate-ephemeral-key: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
