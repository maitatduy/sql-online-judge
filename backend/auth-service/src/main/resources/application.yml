server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: auth-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

management:
  health:
    mail:
      enabled: false
  server:
    port: 9081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

sqljudge:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    generate-ephemeral-key: false
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  email:
    from: ${MAIL_FROM}
    frontend-url: ${FRONTEND_URL}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
