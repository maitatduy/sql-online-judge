server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: auth-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2s
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${OAUTH_GITHUB_CLIENT_ID}
            client-secret: ${OAUTH_GITHUB_CLIENT_SECRET}
            scope: read:user,user:email
            redirect-uri: ${PUBLIC_API_URL}/api/auth/login/oauth2/code/{registrationId}
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET}
            scope: profile,email
            redirect-uri: ${PUBLIC_API_URL}/api/auth/login/oauth2/code/{registrationId}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

management:
  health:
    mail:
      enabled: false
  server:
    port: 9081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

sqljudge:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    generate-ephemeral-key: false
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  oauth:
    github:
      emails-uri: https://api.github.com/user/emails
  email:
    from: ${MAIL_FROM}
    frontend-url: ${FRONTEND_URL}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
