spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-github-client
            client-secret: test-github-secret
            redirect-uri: http://localhost:8080/api/auth/login/oauth2/code/{registrationId}
          google:
            client-id: test-google-client
            client-secret: test-google-secret
            redirect-uri: http://localhost:8080/api/auth/login/oauth2/code/{registrationId}
  mail:
    host: localhost
    port: 1025

sqljudge:
  jwt:
    generate-ephemeral-key: true
  security:
    allowed-origins: http://localhost:3000
  email:
    from: no-reply@sqljudge.test
    frontend-url: http://localhost:3000
  avatar:
    cloudinary:
      cloud-name: test-cloud
      api-key: test-key
      api-secret: test-secret
