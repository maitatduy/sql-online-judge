server:
  port: 8087
  shutdown: graceful

spring:
  application:
    name: ai-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2s
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          problem-service:
            connect-timeout: 1000
            read-timeout: 3000
          contest-service:
            connect-timeout: 1000
            read-timeout: 3000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL}/internal/jwks

management:
  server:
    port: 9087
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

sqljudge:
  problem-service-url: ${PROBLEM_SERVICE_URL}
  contest-service-url: ${CONTEST_SERVICE_URL}
  internal:
    api-token: ${INTERNAL_API_TOKEN}
  ai:
    api-key: ${LLM_API_KEY}
    model: ${LLM_MODEL}
    daily-message-limit: ${LLM_DAILY_MESSAGE_LIMIT}
    effort: low
    max-tokens: 16000
    history-messages: 20

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - feign.FeignException$NotFound
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
