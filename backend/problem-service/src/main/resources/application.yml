server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: problem-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2s
  cache:
    type: redis
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL}/internal/jwks

management:
  server:
    port: 9082
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

sqljudge:
  outbox:
    relay-enabled: true
    relay-interval: 500ms
    batch-size: 100
    send-timeout: 10s
    claim-timeout: 60s
  internal:
    api-token: ${INTERNAL_API_TOKEN}
  judge:
    engine-versions:
      POSTGRESQL: PostgreSQL 16
      MYSQL: MySQL 8
      SQLITE: SQLite 3

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
