spring:
  config:
    import: optional:file:../../infra/.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT}/sqljudge_problem
    username: sqljudge_problem
    password: ${MYSQL_PROBLEM_PASSWORD}
  flyway:
    locations: classpath:db/migration,classpath:db/seed

management:
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
