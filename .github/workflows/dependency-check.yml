name: Dependency check

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backend/**/pom.xml"

permissions:
  contents: read

concurrency:
  group: dependency-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend dependency check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Require NVD API key
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Secret NVD_API_KEY is not set"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - run: ./mvnw --batch-mode --no-transfer-progress install -DskipTests -Dspotless.check.skip=true -Djacoco.skip=true
      - run: ./mvnw --batch-mode --no-transfer-progress dependency-check:aggregate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.*
          retention-days: 14
